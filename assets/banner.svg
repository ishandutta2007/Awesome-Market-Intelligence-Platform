<svg width="850" height="200" viewBox="0 0 850 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid { stroke: rgba(56, 139, 253, 0.1); stroke-width: 1; }
    .chart-line { stroke: #58a6ff; stroke-width: 3; fill: none; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 4s ease-in-out infinite alternate; }
    .chart-node { fill: #bc8cff; filter: drop-shadow(0 0 6px #bc8cff); animation: pulse 2s ease-in-out infinite alternate; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: url(#text-grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #8b949e; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #3fb950; }

    @keyframes draw {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.3); opacity: 1; }
    }
  </style>

  <!-- Background Layer -->
  <rect class="bg" width="850" height="200" rx="12" />

  <!-- Background Grid Dynamic Pattern -->
  <path class="grid" d="M0,40 H850 M0,80 H850 M0,120 H850 M0,160 H850 M100,0 V200 M200,0 V200 M300,0 V200 M400,0 V200 M500,0 V200 M600,0 V200 M700,0 V200 M800,0 V200" />

  <!-- Dynamic Market Trend Line (Background Accent) -->
  <path class="chart-line" d="M 50,150 Q 150,160 250,110 T 450,120 T 650,60 T 800,40" />

  <!-- Dynamic Nodes -->
  <circle class="chart-node" cx="250" cy="110" r="5" />
  <circle class="chart-node" cx="450" cy="120" r="5" />
  <circle class="chart-node" cx="650" cy="60" r="5" />
  <circle class="chart-node" cx="800" cy="40" r="6" />

  <!-- Foreground Content (Guaranteed high visibility and clear layer stack) -->
  <g transform="translate(40, 65)">
    <text class="title" x="0" y="35">Awesome Market Intelligence Platform 📊</text>
    <text class="subtitle" x="0" y="70">Curated Ecosystem of SaaS Platforms &amp; Open-Source Market Research Tools</text>
    <rect x="0" y="85" width="220" height="24" rx="12" fill="rgba(63, 185, 80, 0.15)" stroke="#3fb950" stroke-width="1"/>
    <text class="badge" x="12" y="101">⚡ Updated September 2026</text>
  </g>
</svg>
